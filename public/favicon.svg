<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rounded dark obsidian background -->
  <rect width="64" height="64" rx="16" fill="#090a0f" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="url(#borderGlow)" stroke-width="1.5" stroke-opacity="0.6" />
  
  <defs>
    <linearGradient id="neonGradient" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="borderGlow" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Group with glow filter representing adaptive multi-surfaces (Wide, Square, Tall) -->
  <g filter="url(#glow)">
    <!-- 1. Top Wide Banner: x=12, y=12, w=22, h=10 -->
    <rect x="12" y="12" width="22" height="10" rx="2.5" stroke="url(#neonGradient)" stroke-width="2.5" fill="none" />
    
    <!-- 2. Bottom Square: x=12, y=26, w=22, h=26 -->
    <rect x="12" y="26" width="22" height="26" rx="3.5" stroke="url(#neonGradient)" stroke-width="2.5" fill="none" />
    
    <!-- 3. Right Tall Story: x=38, y=12, w=14, h=40 -->
    <rect x="38" y="12" width="14" height="40" rx="3" stroke="url(#neonGradient)" stroke-width="2.5" fill="none" />
  </g>
</svg>